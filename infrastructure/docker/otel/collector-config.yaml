# NexusIQ OpenTelemetry Collector — Phase 0 configuration.
#
# Accepts OTLP from spring-api and ai-service and logs it. Phase 8 extends this
# with Jaeger/Tempo (traces) and Prometheus (metrics) exporters. See ADR-007 and
# docs/OPERATIONS/OBSERVABILITY.md.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Phase 0: prove the pipeline works. Replaced by Jaeger/Tempo + Prometheus in
  # Phase 8. `detailed` prints span/metric contents, not just counts, which is
  # what makes the pipeline verifiable (and useful while instrumenting).
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
